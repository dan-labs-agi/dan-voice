[project]
name = "voice-cowork-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MakPr016", email = "makpr0168@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "pywhispercpp>=1.5.0",
    "pyttsx3>=2.99",
    "pywin32>=312; sys_platform == 'win32'",
    "qrcode>=8.2",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.51.0",
    "kokoro-onnx>=0.5.0",
    "sherpa-onnx>=1.13.0",
]

[project.scripts]
voice-cowork = "voice_cowork_backend.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
